name: Blog check

# Every time an article, the study library or the blog tools change, build the blog
# and check every cited study against Crossref and PubMed.
on:
  push:
    paths:
      - "blog/**"
      - "research/**"
      - "tools/build_blog.py"
      - "tools/check_blog.py"
      - "www/assets/blog.css"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown pyyaml pillow
      - name: Build (with drafts)
        run: python3 tools/build_blog.py --drafts
      - name: Check pages, sitemap and every citation
        run: python3 tools/check_blog.py --online
