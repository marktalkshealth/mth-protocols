<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your account · Mark Talks Health</title>
<meta name="theme-color" content="#f7f1e7">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/app-icon-192.png">
<link rel="apple-touch-icon" href="assets/app-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/mth.css">
<script src="assets/vendor/supabase-2.118.0.js"></script>
<script src="assets/mth.js"></script>
<style>
.ac{max-width:720px;margin:0 auto;padding:44px 20px 70px}
.ac .card{padding:22px;margin-top:16px}
.ac .row{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.ac .p{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.ac .p:first-of-type{border-top:0}
.ac .p .im{width:64px;height:64px;border-radius:14px;background:#d8c4ad center/cover;flex:none}
.ac .p .tx{flex:1;min-width:0}
.ac .p b{font-family:var(--serif);font-size:22px;font-weight:500;display:block;line-height:1.1}
.ac h3{margin:0 0 4px;font-family:var(--serif);font-weight:500;font-size:24px}
</style>
</head>
<body>
<main class="ac" id="ac"><div class="mx-wait">Your account</div></main>
<script>
(async function(){
  await MTH.require();
  var P=MTH.config.products.gut, own=MTH.owns("gut"), rem=MTH.remembered();
  document.getElementById("ac").innerHTML='<div class="kick">Your account</div><h1 class="t">Hello<em>.</em></h1><p class="lead">Signed in as <b>'+MTH.esc(MTH.user.email)+'</b></p>'+
    '<div class="card"><h3>Your protocols</h3>'+(own?
      '<div class="p"><div class="im" style="background-image:url(https://marktalkshealth.github.io/mth-protocols/site/steps/1-fasting.jpg)"></div><div class="tx"><b>'+P.name+'</b><span class="small">Lifetime access</span></div></div>'+
      '<div class="row" style="margin-top:12px"><a class="b" href="'+P.app+'">Open my app</a><a class="b ghost" href="'+P.course+'">Open the course</a></div>'
      :'<p class="muted" style="margin:6px 0 14px">You don\u2019t own a protocol yet.</p><a class="b" href="'+P.sales+'#checkout">Get the Gut Health Protocol · '+P.price+'</a>')+'</div>'+
    '<div class="card"><h3>This device</h3><label class="check" style="margin:8px 0 6px"><input type="checkbox" id="rem"'+(rem?' checked':'')+'> Keep me signed in on this device</label><p class="small" style="margin:0 0 14px">Untick on a shared computer: you\u2019ll be signed out when the browser closes.</p><button class="b ghost" id="out">Sign out</button></div>'+
    '<p class="small" style="margin-top:22px">Questions or a refund within 30 days? Email <a href="mailto:marktalkshealth@gmail.com">marktalkshealth@gmail.com</a>.</p>';
  document.getElementById("out").onclick=MTH.signOut;
  document.getElementById("rem").onchange=async function(){
    MTH.setRemember(this.checked);
    /* move the saved sign-in to the right place straight away */
    var s=(await MTH.sb.auth.getSession()).data.session; if(s) await MTH.sb.auth.setSession({ access_token:s.access_token, refresh_token:s.refresh_token });
    MTH.toast(this.checked?"You\u2019ll stay signed in on this device.":"You\u2019ll be signed out when the browser closes.");
  };
})();
</script>
</body>
</html>
