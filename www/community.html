<script>
/* Phones: full-screen community with a slim top bar. Computers: site header, then the Hub in a frame. */
(function(){
  var standalone=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;
  var desk=!standalone&&window.matchMedia&&matchMedia("(min-width: 900px)").matches;
  document.documentElement.classList.add(desk?"hub-desk":"hub-phone");
  if(!desk) document.documentElement.classList.add("mx-bare");
})();
</script>
<script src="assets/vendor/supabase-2.118.0.js"></script>
<script src="assets/mth.js?v=202610241500"></script>
<style>
html.hub-phone,html.hub-phone body{height:100%;overflow:hidden;background:#fff}
html.hub-phone #hs{position:fixed;inset:0;display:flex;flex-direction:column}
#hs .ab{flex:none;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid #e7dfd4;background:#fff}
#hs .ab a.home{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;color:#2b2622;text-decoration:none}
#hs .ab a.home svg{width:22px;height:22px}
#hs .ab .t{flex:1;min-width:0}
#hs .ab .k{font:700 10px/1 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#b8664a}
#hs .ab .n{font:500 20px/1.15 'Cormorant Garamond',Georgia,serif;color:#2b2622}
#hs .ab .n em{font-style:italic;color:#c0623f}
#hs iframe{flex:1;width:100%;border:0;display:block;background:#fff}
#hs .frame{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
html.hub-desk body{background:#f6f1ea}
html.hub-desk #hs{max-width:900px;margin:0 auto;padding:30px 24px 40px}
html.hub-desk #hs .ab{border:0;background:transparent;padding:0 0 16px}
html.hub-desk #hs .ab a.home{display:none}
html.hub-desk #hs .ab .k{font-size:11px;letter-spacing:.2em;margin-bottom:8px}
html.hub-desk #hs .ab .n{font-size:42px;line-height:1.02}
html.hub-desk #hs .frame{background:#fff;border:1px solid #e7dccb;border-radius:22px;overflow:hidden;box-shadow:0 24px 60px rgba(43,39,36,.10)}
html.hub-desk #hs iframe{height:calc(100vh - 200px);min-height:720px}
.lock{max-width:520px;margin:16px auto 40px;padding:0 20px;text-align:center}
</style>
</head>
<body>
<div id="hs">
  <div class="ab"><a class="home" href="index.html" aria-label="Back to the site"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div class="t"><div class="k">Members</div><div class="n">The Healing <em>Hub</em></div></div></div>
  <div class="frame"><iframe title="The Healing Hub" allow="autoplay; fullscreen; clipboard-write"></iframe></div>
</div>
<script>
(async function(){
  await MTH.require();
  var hs=document.getElementById("hs");
  if(!MTH.ownsAny()){
    document.documentElement.classList.remove("hub-phone","mx-bare"); document.documentElement.classList.add("hub-desk"); MTH.chrome();
    hs.innerHTML='<div class="lock"><div class="kick">Members only</div><h1 class="t">The Healing <em>Hub</em></h1><p class="lead" style="margin:0 auto 20px">The community is included with every protocol: daily check-ins, questions answered by Mark, and live sessions.</p><a class="b" href="protocols.html">Choose a protocol</a></div>';
    return;
  }
  /* the Hub reads window.parent.MTH_USER to know who is posting */
  window.MTH_USER={ id:MTH.user.id, email:(MTH.user.email||"").toLowerCase() };
  hs.querySelector("iframe").src="../hub/index.html";
})();
</script>
</body>
