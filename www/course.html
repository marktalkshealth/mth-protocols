<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your course · Mark Talks Health</title>
<meta name="theme-color" content="#f7f1e7">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/app-icon-192.png">
<link rel="apple-touch-icon" href="assets/app-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/mth.css?v=202610231530">
<script src="assets/vendor/supabase-2.118.0.js"></script>
<script src="assets/mth.js?v=202610241500"></script>
<script src="assets/courses.js?v=202610221130"></script>
<style>
.cx{max-width:1240px;margin:0 auto;padding:22px 20px 70px;display:grid;gap:28px}
@media(min-width:980px){.cx{grid-template-columns:330px 1fr;align-items:start;padding-top:30px}}
/* ---------- curriculum sidebar ---------- */
.side{display:none}
@media(min-width:980px){.side{display:block;position:sticky;top:calc(var(--hh) + 20px);max-height:calc(100vh - var(--hh) - 40px);overflow:auto;padding:18px 14px 18px 18px}}
.side .ttl{font-family:var(--serif);font-size:24px;line-height:1.1;margin:4px 0 12px}
.side .ttl a{text-decoration:none}
.pbar{height:8px;border-radius:99px;background:var(--bg2);overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--terra),var(--gold));border-radius:99px;transition:width .5s}
:is(.side,.osh) .sec{margin-top:16px}
:is(.side,.osh) .sec:first-of-type{margin-top:14px}
:is(.side,.osh) .sec h4{margin:0 0 4px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:700}
:is(.side,.osh) a.ls{display:flex;gap:10px;align-items:center;padding:8px 8px;border-radius:12px;text-decoration:none;font-size:14.5px;line-height:1.3;color:var(--ink)}
:is(.side,.osh) a.ls:hover{background:var(--bg)}
:is(.side,.osh) a.ls.on{background:var(--terraS);font-weight:600}
.dot{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;color:#fff;background:#fff}
.dot.done{background:var(--sage);border-color:var(--sage)}
.dot.done:before{content:"✓"}
/* ---------- lesson ---------- */
.lhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ob{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font:600 14px var(--sans);color:var(--ink);cursor:pointer}
.ob span{font-weight:500;color:var(--faint)}
.lstep{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--terra)}
@media(min-width:980px){.ob{display:none}}
/* outline sheet (phone) */
.osh{position:fixed;inset:0;z-index:90;background:rgba(20,17,15,.45);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .2s}
.osh.on{opacity:1;pointer-events:auto}
.osh .pan{width:100%;max-height:82vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:14px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(24px);transition:transform .25s}
.osh.on .pan{transform:none}
.osh .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.osh .x{border:0;background:var(--bg2);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;color:var(--ink)}
.lt{font-family:var(--serif);font-weight:500;font-size:clamp(32px,5.4vw,46px);line-height:1.03;margin:4px 0 14px;letter-spacing:-.01em}
.vid{position:relative;aspect-ratio:16/9;border-radius:20px;overflow:hidden;background:#1d1a17;box-shadow:0 22px 50px rgba(43,39,36,.18)}
.vid iframe,.vid video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.vid.ph{background:#2b2724 center/cover}
.vid.ph:before{content:"";position:absolute;inset:0;background:rgba(20,17,15,.28)}
.vid.ph .soon{position:absolute;left:14px;bottom:14px;padding:6px 12px;border-radius:999px;background:rgba(255,252,247,.92);font-size:12.5px;font-weight:600;color:var(--ink)}
.about{font-size:16.5px;color:var(--ink);margin:18px 0 0;max-width:720px}
.blk{margin-top:18px;padding:16px 18px}
.erow{display:flex;align-items:center;gap:12px;margin-top:18px;padding:12px 14px}
.erow .ic{width:36px;height:44px;border-radius:6px;background:linear-gradient(150deg,var(--terra),#7e3b25);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-size:17px;flex:none}
.erow b{flex:1;font-size:15.5px}
.erow .acts{display:flex;gap:6px}
.appbtn{margin-top:18px}
summary.qh{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:15.5px}
summary.qh::-webkit-details-marker{display:none}
summary.qh:after{content:"+";font-size:22px;color:var(--terra);line-height:1}
details[open]>summary.qh:after{content:"–"}
details.qz[open] .qs{margin-top:10px}
.nav2 .nx{flex:1;justify-content:center;text-align:center}
.blk h3{margin:0 0 4px;font-family:var(--serif);font-weight:500;font-size:26px;line-height:1.1}
.ebook{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.ebook .ic{width:54px;height:66px;border-radius:8px;background:linear-gradient(150deg,var(--terra),#7e3b25);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-size:22px;flex:none;box-shadow:0 8px 18px rgba(126,59,37,.25)}
.ebook .tx{flex:1;min-width:200px}
.ebook .acts{display:flex;gap:8px;flex-wrap:wrap}
/* quiz */
.qz .q{padding:16px 0;border-top:1px solid var(--line)}
.qz .q:first-of-type{border-top:0}
.qz .q p.qq{font-weight:600;margin:0 0 10px;font-size:16px}
.qz .q p.qq span{color:var(--faint);font-weight:500;margin-right:6px}
.qz .opts{display:grid;gap:8px}
.qz .op{display:flex;gap:10px;align-items:center;text-align:left;width:100%;min-height:48px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:15px;color:var(--ink);transition:border-color .15s,background .15s}
.qz .op:hover:not(:disabled){border-color:var(--terra)}
.qz .op i{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;color:var(--muted)}
.qz .op:disabled{cursor:default}
.qz .op.right{border-color:var(--sage);background:var(--sageS)}
.qz .op.right i{background:var(--sage);border-color:var(--sage);color:#fff}
.qz .op.wrong{border-color:#d9a08b;background:#f8e9e3}
.qz .op.wrong i{background:#c0623f;border-color:#c0623f;color:#fff}
.qz .fb{margin:10px 0 0;font-size:14.5px;color:var(--muted);padding:10px 12px;border-radius:12px;background:var(--bg)}
.qz .fb b{color:var(--ink)}
.qz .sum{margin-top:12px;padding:16px;border-radius:16px;background:var(--sageS);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.qz .sum b{font-family:var(--serif);font-size:24px;font-weight:500}
.nav2{display:flex;gap:10px;align-items:stretch;margin-top:24px}
.reader{position:fixed;inset:0;z-index:85;background:var(--bg);display:flex;flex-direction:column}
.reader .bar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--line)}
.reader .bar b{flex:1;font-family:var(--serif);font-size:20px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reader iframe{flex:1;border:0;width:100%;background:#fff}
@media(max-width:979px){.cx{padding-top:14px}}
</style>
</head>
<body>
<main class="cx" id="cx"><div class="mx-wait" style="grid-column:1/-1">Opening your course…</div></main>
<script>
(async function(){
  await MTH.ready;
  var PK=MTH.product();
  if(MTH.user&&!MTH.owns(PK)&&MTH.ownsAny()&&!MTH.qs("p")) PK=MTH.owned[0];
  await MTH.require(PK);
  MTH.remember(PK);
  var C=window.MTH_COURSES[PK], sb=MTH.sb, esc=MTH.esc, uid=MTH.user.id, PP=MTH.config.products[PK];
  var IMG=MTH.config.assets+"steps/";
  var flat=[]; C.sections.forEach(function(s){ s.lessons.forEach(function(l){ l.sec=s; flat.push(l); }); });
  var byId={}; flat.forEach(function(l,i){ l.i=i; byId[l.id]=l; });
  var media={}, prog={};
  var LAST="mth_course_last_"+C.product;

  /* ---------- load members-only media + progress ---------- */
  try{
    var r1=await sb.from("mth_lesson_media").select("lesson_id,video_url,ebook_url").eq("product",C.product);
    (r1.data||[]).forEach(function(m){ media[m.lesson_id]=m; });
  }catch(e){ console.warn("media",e); }
  try{
    var r2=await sb.from("mth_progress").select("lesson_id,done,quiz").eq("product",C.product);
    (r2.data||[]).forEach(function(p){ prog[p.lesson_id]=p; });
  }catch(e){ console.warn("progress",e); }

  function isDone(id){ return !!(prog[id]&&prog[id].done); }
  function pct(){ var d=flat.filter(function(l){ return isDone(l.id); }).length; return { d:d, n:flat.length, p:Math.round(100*d/flat.length) }; }
  async function save(id,patch){
    var row=Object.assign({ user_id:uid, product:C.product, lesson_id:id, updated_at:new Date().toISOString() },prog[id]?{ done:prog[id].done, quiz:prog[id].quiz }:{},patch);
    prog[id]=row; side();
    var r=await sb.from("mth_progress").upsert(row,{ onConflict:"user_id,product,lesson_id" });
    if(r.error){ console.warn(r.error); MTH.toast("Couldn’t save your progress. Check your connection."); }
  }

  var root=document.getElementById("cx");
  root.innerHTML='<aside class="side card" aria-label="Course lessons"></aside><section id="main" aria-live="polite"></section>';
  var SIDE=root.querySelector(".side"), MAIN=document.getElementById("main"), cur=null;

  function side(){
    var P=pct();
    SIDE.innerHTML='<div class="kick">Your course</div><div class="ttl"><a href="course.html?p='+PK+'" data-go="">'+esc(C.title)+'</a></div>'+
      '<div class="pbar" aria-label="'+P.p+'% complete"><i style="width:'+P.p+'%"></i></div><div class="small" style="margin-top:6px">'+P.d+' of '+P.n+' lessons complete</div>'+
      C.sections.map(function(s){ return '<div class="sec"><h4>'+(s.step?'Step '+s.step+' · ':'')+esc(s.title)+'</h4>'+
        s.lessons.map(function(l){ return '<a class="ls'+(cur===l.id?' on':'')+'" href="?p='+PK+'&l='+l.id+'" data-go="'+l.id+'"><span class="dot'+(isDone(l.id)?' done':'')+'"></span><span>'+esc(l.title)+'</span></a>'; }).join("")+'</div>'; }).join("");
  }

  /* ---------- lesson list (desktop sidebar, phone sheet) ---------- */
  var SH=document.createElement("div"); SH.className="osh"; SH.innerHTML='<div class="pan" role="dialog" aria-label="Lessons"></div>'; document.body.appendChild(SH);
  function outlineHtml(){
    var P=pct();
    return '<div class="ttl" style="font-family:var(--serif);font-size:24px;line-height:1.1;margin:4px 0 10px">'+esc(C.title)+'</div>'+
      '<div class="pbar" aria-label="'+P.p+'% complete"><i style="width:'+P.p+'%"></i></div><div class="small" style="margin-top:6px">'+P.d+' of '+P.n+' lessons complete</div>'+
      C.sections.map(function(s){ return '<div class="sec"><h4>'+(s.step?'Step '+s.step+' · ':'')+esc(s.title)+'</h4>'+
        s.lessons.map(function(l){ return '<a class="ls'+(cur===l.id?' on':'')+'" href="?p='+PK+'&l='+l.id+'" data-go="'+l.id+'"><span class="dot'+(isDone(l.id)?' done':'')+'"></span><span>'+esc(l.title)+'</span></a>'; }).join("")+'</div>'; }).join("");
  }
  function side(){ SIDE.innerHTML=outlineHtml(); }
  function openOutline(){ SH.querySelector(".pan").innerHTML='<div class="top"><b class="lstep">Lessons</b><button class="x" type="button" aria-label="Close">×</button></div>'+outlineHtml(); SH.classList.add("on"); document.body.style.overflow="hidden"; }
  function closeOutline(){ SH.classList.remove("on"); document.body.style.overflow=""; }
  SH.addEventListener("click",function(e){ if(e.target===SH||e.target.closest(".x")||e.target.closest("a[data-go]")) closeOutline(); });
  function resumeId(){
    var last=null; try{ last=localStorage.getItem(LAST); }catch(e){}
    if(byId[last]) return last;
    return (flat.filter(function(l){ return !isDone(l.id); })[0]||flat[0]).id;
  }
  side();

  /* ---------- video ---------- */
  function videoHtml(l){
    var u=(media[l.id]&&media[l.id].video_url||"").trim(), m;
    if(!u) return '<div class="vid ph" style="background-image:url('+IMG+l.sec.img+'.jpg)"><span class="soon">Video coming soon</span></div>';
    if((m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{6,})/))) return '<div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/'+m[1]+'?rel=0&modestbranding=1" title="'+esc(l.title)+'" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe></div>';
    if((m=u.match(/vimeo\.com\/(?:video\/)?(\d+)(?:\/([a-z0-9]+))?/i))) return '<div class="vid"><iframe src="https://player.vimeo.com/video/'+m[1]+(m[2]?'?h='+m[2]:'')+'" title="'+esc(l.title)+'" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div>';
    if((m=u.match(/^wistia:([a-z0-9]+)$/i))||(m=u.match(/wistia\.(?:com|net)\/(?:medias|embed\/iframe)\/([a-z0-9]+)/i))) return '<div class="vid"><iframe src="https://fast.wistia.net/embed/iframe/'+m[1]+'?playerColor=c0623f&videoFoam=false" title="'+esc(l.title)+'" allow="autoplay; fullscreen" allowfullscreen></iframe></div>';
    if(/^https?:\/\//i.test(u)) return '<div class="vid"><video controls playsinline preload="metadata" src="'+esc(u)+'"></video></div>';
    return '<div class="vid" data-storage-video="'+esc(u)+'"><video controls playsinline preload="metadata"></video></div>';   /* a file in the course-files bucket */
  }
  async function storageVideos(){
    var el=MAIN.querySelector("[data-storage-video]"); if(!el) return;
    var r=await sb.storage.from("course-files").createSignedUrl(el.getAttribute("data-storage-video"),60*60*6);
    if(r.data) el.querySelector("video").src=r.data.signedUrl;
  }

  /* ---------- ebook ---------- */
  function ebookHtml(l){
    var u=(media[l.id]&&media[l.id].ebook_url||"").trim();
    if(l.app) return '';
    if(!u) return '';
    return '<div class="card erow"><div class="ic">e</div><b>The ebook</b><div class="acts"><button class="b sm" data-read>Read</button><button class="b sm ghost" data-dl aria-label="Download the ebook">↓</button></div></div>';
  }
  async function ebookBlob(u){
    if(/^https?:\/\//i.test(u)){ return null; }
    var r=await sb.storage.from("course-files").download(u);
    if(r.error) throw r.error; return r.data;
  }
  function wireEbook(l){
    var u=(media[l.id]&&media[l.id].ebook_url||"").trim(); if(!u) return;
    var name=u.split("/").pop()||"ebook";
    var rd=MAIN.querySelector("[data-read]"), dl=MAIN.querySelector("[data-dl]");
    rd&&rd.addEventListener("click",async function(){
      if(/^https?:\/\//i.test(u)){ window.open(u,"_blank","noopener"); return; }
      rd.disabled=true; rd.textContent="Opening…";
      try{
        var b=await ebookBlob(u), html=/\.html?$/i.test(u);
        var rdr=document.createElement("div"); rdr.className="reader";
        rdr.innerHTML='<div class="bar"><button class="b sm ghost" type="button">Close</button><b>'+esc(l.title)+'</b></div><iframe title="'+esc(l.title)+' ebook" sandbox="allow-scripts allow-popups allow-downloads allow-modals allow-forms"></iframe>';
        var fr=rdr.querySelector("iframe");
        if(html){ /* the ebook runs sandboxed (no access to the member's sign-in); give it a private notepad instead of localStorage */
          var shim='<script>(function(){function S(){var d={};return{getItem:function(k){return k in d?d[k]:null},setItem:function(k,v){d[k]=String(v)},removeItem:function(k){delete d[k]},clear:function(){d={}},key:function(i){return Object.keys(d)[i]||null},get length(){return Object.keys(d).length}}}["localStorage","sessionStorage"].forEach(function(n){try{window[n].length}catch(e){try{Object.defineProperty(window,n,{value:S(),configurable:true})}catch(x){}}})})()<\/script>';
          var src=await b.text(); fr.srcdoc=/<head[^>]*>/i.test(src)?src.replace(/<head[^>]*>/i,function(m){ return m+shim; }):shim+src; } else { fr.removeAttribute("sandbox"); fr.src=URL.createObjectURL(b); }
        rdr.querySelector("button").onclick=function(){ rdr.remove(); document.body.style.overflow=""; };
        document.body.appendChild(rdr); document.body.style.overflow="hidden";
        if(!isDone(l.id)&&!l.quiz) save(l.id,{ done:true });
      }catch(e){ MTH.toast("Couldn’t open the ebook. Please try again."); console.warn(e); }
      rd.disabled=false; rd.textContent="Read";
    });
    dl&&dl.addEventListener("click",async function(){
      if(/^https?:\/\//i.test(u)){ var a0=document.createElement("a"); a0.href=u; a0.download=name; a0.target="_blank"; a0.rel="noopener"; a0.click(); return; }
      dl.disabled=true;
      try{ var b=await ebookBlob(u), a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
      catch(e){ MTH.toast("Couldn’t download the ebook. Please try again."); }
      dl.disabled=false;
    });
  }

  /* ---------- quiz (no pass mark) ---------- */
  function quizHtml(l){
    if(!l.quiz) return "";
    return '<details class="card blk qz" id="qz"><summary class="qh">Quick refresher · '+l.quiz.length+' questions</summary><div class="qs"></div><div class="out"></div></details>';
  }
  function runQuiz(l){
    var box=MAIN.querySelector("#qz"); if(!box) return;
    var qs=box.querySelector(".qs"), out=box.querySelector(".out"), ans=[];
    function draw(){
      ans=[]; out.innerHTML="";
      qs.innerHTML=l.quiz.map(function(q,i){ return '<div class="q" data-q="'+i+'"><p class="qq"><span>'+(i+1)+'.</span>'+esc(q.q)+'</p><div class="opts">'+
        q.o.map(function(o,j){ return '<button class="op" type="button" data-o="'+j+'"><i>'+"ABCD"[j]+'</i><span>'+esc(o)+'</span></button>'; }).join("")+'</div></div>'; }).join("");
      qs.querySelectorAll(".q").forEach(function(qe){
        var i=+qe.dataset.q, q=l.quiz[i];
        qe.querySelectorAll(".op").forEach(function(b){ b.addEventListener("click",function(){
          if(ans[i]!=null) return; var j=+b.dataset.o; ans[i]=j;
          qe.querySelectorAll(".op").forEach(function(x){ x.disabled=true; var k=+x.dataset.o; if(k===q.a) x.classList.add("right"); else if(k===j) x.classList.add("wrong"); });
          var f=document.createElement("p"); f.className="fb"; f.innerHTML='<b>'+(j===q.a?'Right.':'Not quite.')+'</b> '+esc(q.fb); qe.appendChild(f);
          if(ans.filter(function(x){ return x!=null; }).length===l.quiz.length) finish();
        }); });
      });
    }
    function finish(){
      var score=ans.filter(function(a,i){ return a===l.quiz[i].a; }).length, n=l.quiz.length;
      out.innerHTML='<div class="sum"><div style="flex:1"><b>'+score+' of '+n+'</b><div class="small">'+(score===n?'Perfect. You know this step inside out.':score>=n-1?'Great refresher.':'Nice work. The explanations above cover anything you missed.')+'</div></div><button class="b sm ghost" type="button">Try again</button></div>';
      out.querySelector("button").onclick=function(){ draw(); box.scrollIntoView({behavior:"smooth",block:"start"}); };
      save(l.id,{ done:true, quiz:{ score:score, total:n, at:new Date().toISOString() } });
      MTH.toast("Lesson complete ✓");
    }
    draw();
    var pq=prog[l.id]&&prog[l.id].quiz; if(pq) out.innerHTML='<p class="small" style="margin:12px 0 0">Last time: '+pq.score+' of '+pq.total+'. Take it again any time.</p>';
  }


  /* ---------- one lesson ---------- */
  function lesson(id){
    var l=byId[id]||byId[resumeId()];
    cur=l.id; side(); try{ localStorage.setItem(LAST,l.id); }catch(e){}
    document.title=l.title+" · "+PP.name;
    var prev=flat[l.i-1], next=flat[l.i+1];
    MAIN.innerHTML='<div class="lhead"><button class="ob" type="button" data-outline>☰ Lessons <span>'+(l.i+1)+'/'+flat.length+'</span></button><span class="lstep">'+(l.sec.step?'Step '+l.sec.step:'Start here')+'</span></div>'+
      '<h1 class="lt">'+esc(l.title)+'</h1>'+videoHtml(l)+'<p class="about">'+esc(l.text)+'</p>'+
      (l.app?'<a class="b appbtn" href="'+PP.app+'">Open my app</a>':'')+
      ebookHtml(l)+quizHtml(l)+
      '<div class="nav2">'+(prev?'<a class="b ghost" href="?p='+PK+'&l='+prev.id+'" data-go="'+prev.id+'" aria-label="Previous lesson">←</a>':'')+
        (next?'<a class="b nx" href="?p='+PK+'&l='+next.id+'" data-go="'+next.id+'" data-next>Next lesson →</a>':'<button class="b nx" type="button" data-finish>Finish course ✓</button>')+'</div>';
    MAIN.querySelector("[data-outline]").addEventListener("click",openOutline);
    var nx=MAIN.querySelector("[data-next]"); if(nx) nx.addEventListener("click",function(){ if(!isDone(l.id)) save(l.id,{ done:true }); });
    var fin=MAIN.querySelector("[data-finish]"); if(fin) fin.addEventListener("click",function(){ if(!isDone(l.id)) save(l.id,{ done:true }); MTH.toast("Course complete. Well done ✓"); setTimeout(openOutline,400); });
    wireEbook(l); runQuiz(l); storageVideos();
    window.scrollTo(0,0);
  }

  /* ---------- in-page navigation ---------- */
  function route(){ var id=MTH.qs("l"); if(!(id&&byId[id])){ id=resumeId(); history.replaceState(null,"","?p="+PK+"&l="+id); } lesson(id); }
  document.addEventListener("click",function(e){
    var a=e.target.closest&&e.target.closest("a[data-go]"); if(!a||e.metaKey||e.ctrlKey||e.shiftKey) return;
    e.preventDefault(); var id=a.getAttribute("data-go");
    if(!id) id=resumeId();
    history.pushState(null,"","?p="+PK+"&l="+id); route();
  });
  window.addEventListener("popstate",route);
  route();
})();
</script>
</body>
</html>
