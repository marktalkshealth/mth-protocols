# Mark Talks Health blog settings. Read by tools/build_blog.py and tools/check_blog.py.
site: https://marktalkshealth.com
brand: Mark Talks Health
blog:
  title: The Mark Talks Health Blog
  seo_title: Gut Health & Natural Healing Research, Explained
  description: Deep, research-backed articles on gut health, fasting and natural healing. Every article starts with the problem, walks through the studies and ends with a plan you can use.
  kicker: The Blog
  headline: Research you can <em>actually use</em>
  dek: Every article follows the same formula. The problem, the study, the solution. Real studies, linked so you can read them yourself, and a plan you can start this week.

author:
  name: Mark
  slug: mark
  job: Health educator, creator of Mark Talks Health
  photo: /media/site/mark-kitchen.jpg
  short: I'm Mark. I lost 100 pounds by changing how I eat, move, sleep and handle stress, and I've spent years since digging through the research on gut health, fasting and natural healing.
  bio: |
    I'm Mark, the health educator behind Mark Talks Health. I lost 100 pounds by changing how I eat, move, sleep and handle stress, and that experience is why I believe in lifestyle as medicine: looking at the whole person, not just one symptom.

    I'm not a doctor, and nothing here replaces one. What I do is read the research so you don't have to. Every article on this blog links to the original studies, says plainly when a finding comes from mice rather than people, and tells you the limits of each study. My courses and apps turn that research into a daily plan you can follow alongside your healthcare provider.

