categories:
  gut-health: Gut Health
  fasting: Fasting
  nutrition: Nutrition
  stress: Stress & Mind

# Public site pages listed in sitemap.xml (paths as Cloudflare serves them).
pages:
  - {path: /, priority: 1.0}
  - {path: /protocols, priority: 0.8}
  - {path: /gut, priority: 0.9}
  - {path: /diabetes, priority: 0.8}
  - {path: /glp1, priority: 0.8}
  - {path: /healing, priority: 0.7}
  - {path: /picks, priority: 0.5}
  - {path: /partners, priority: 0.4}
  - {path: /privacy, priority: 0.2}
  - {path: /terms, priority: 0.2}
  - {path: /refunds, priority: 0.2}

# Pages search engines should not crawl (members-only, admin, app engines, tracking links).
robots_disallow:
  - /admin
  - /account
  - /welcome
  - /login
  - /course
  - /app
  - /community
  - /checkin
  - /snapshot
  - /library
  - /go
  - /hub/
  - /gut/
  - /sugar/
  - /glp1/

# Brand rules every article is checked against (case-insensitive whole words).
banned_words: [keto, ketogenic, "ice cream"]
