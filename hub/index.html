<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>The Healing Hub — Mark Talks Health</title>
<style>html,body{margin:0;background:#fff}</style></head><body>
<!-- =============================================================
  MARK TALKS HEALTH — THE HEALING HUB
  One community for every protocol: Today · Community · Live · Library
  HOW TO USE: paste this whole file into an "Embed code"
  section on a page inside each course (Gut Health, Diabetes, Total
  Body Healing). Set PAGE_PROTOCOL below if you want that course's
  copy to open on its own protocol.
  EDIT YOUR CONTENT: search for "YOUR CONTENT".
============================================================== -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<div id="hub">
<style>
#hub{--bg:#ffffff;--soft:#f6f4f1;--soft2:#efebe6;--ink:#1c1a19;--muted:#6f6863;--faint:#a39a92;--sand:#d8cdc2;--sand2:#e9e2da;--line:#e7e2dc;--sage:#6f8a6a;--sageS:#e8efe6;--terra:#b8664a;--gold:#b08a46;
  --serif:'Cormorant Garamond',Georgia,serif;font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;
  position:relative;max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:84px;overflow-x:hidden}
#hub *{box-sizing:border-box;margin:0;padding:0}
#hub button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
#hub input,#hub textarea{font:inherit;color:inherit}
#hub a{color:inherit;text-decoration:none}
#hub [hidden]{display:none!important}
/* header */
#hub .top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}
#hub .brand{flex:1;min-width:0}
#hub .brand small{display:block;font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
#hub .brand b{font-family:var(--serif);font-weight:600;font-size:24px;line-height:1.05;letter-spacing:-.01em}
#hub .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;white-space:nowrap;background:#fff}
#hub .chip i{width:8px;height:8px;border-radius:50%;background:var(--sage);font-style:normal}
#hub .me{width:38px;height:38px;border-radius:50%;background:var(--soft2);display:grid;place-items:center;font-size:19px;flex:none}
#hub .banner{margin:10px 16px 0;padding:10px 12px;border-radius:6px;background:var(--soft);font-size:13px;color:var(--muted);line-height:1.45}
/* tabs */
#hub .tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:760px;z-index:25;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
#hub .tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--faint);border-radius:6px;position:relative}
#hub .tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#hub .tab.on{color:var(--ink)}
#hub .tab .dot{position:absolute;top:4px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:#d0413a;border:2px solid #fff}
/* sections */
#hub .view{padding:6px 0 20px}
#hub .sec{padding:18px 16px 4px}
#hub .h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
#hub .h h2{font-size:19px;font-weight:600;letter-spacing:-.015em}
#hub .h span{font-size:12px;color:var(--muted)}
#hub .card{background:#fff;border:1px solid var(--line);border-radius:8px}
#hub .kick{font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
#hub .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:6px;font-weight:600;font-size:14px;background:var(--ink);color:#fff}
#hub .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
#hub .btn.sand{background:var(--sand);color:var(--ink)}
#hub .btn.sm{padding:7px 11px;font-size:13px}
#hub .btn:disabled{opacity:.45;cursor:default}
#hub .seg{display:flex;background:var(--soft2);border-radius:8px;padding:3px;gap:3px}
#hub .seg button{flex:1;padding:9px 0;border-radius:6px;font-size:14px;font-weight:600;color:var(--muted)}
#hub .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
#hub .empty{padding:28px 12px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
/* today: hero */
#hub .hello{padding:18px 16px 0}
#hub .hello h1{font-family:var(--serif);font-weight:500;font-size:34px;line-height:1.02;letter-spacing:-.01em;margin:4px 0 6px}
#hub .hello p{color:var(--muted);font-size:14px;line-height:1.5}
#hub .days{display:flex;gap:6px;margin-top:14px}
#hub .dayb{flex:1;aspect-ratio:1;max-width:52px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:600;color:var(--muted);background:#fff;position:relative}
#hub .dayb.done{background:var(--sageS);border-color:#cfdccb;color:var(--sage)}
#hub .dayb.today{background:var(--ink);border-color:var(--ink);color:#fff}
#hub .dayb.sel:not(.today){outline:2px solid var(--ink);outline-offset:1px}
#hub .pillar{margin-top:14px;overflow:hidden}
#hub .pillar .ph{padding:16px;background:linear-gradient(135deg,var(--soft),var(--sand2))}
#hub .pillar .ph b{display:block;font-family:var(--serif);font-weight:600;font-size:27px;line-height:1.05;margin:4px 0 6px}
#hub .pillar .ph p{font-size:14px;color:#4a4440;line-height:1.5}
#hub .tip{margin:0 16px;padding:12px;border-left:3px solid var(--sage);background:var(--sageS);font-size:13.5px;line-height:1.5;border-radius:0 6px 6px 0;margin-top:14px}
#hub .tip strong{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--sage);margin-bottom:3px}
#hub .tasks{padding:8px 16px 4px}
#hub .task{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
#hub .task:last-child{border-bottom:0}
#hub .box{width:22px;height:22px;border-radius:5px;border:1.5px solid var(--sand);flex:none;display:grid;place-items:center;margin-top:1px}
#hub .task.on .box{background:var(--sage);border-color:var(--sage)}
#hub .task.on .box:after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
#hub .task div{font-size:14.5px;line-height:1.45}
#hub .task div small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
#hub .task.on div{color:var(--muted)}
#hub .pact{display:flex;gap:8px;padding:12px 16px 16px;flex-wrap:wrap;align-items:center}
#hub .pact .prog{flex:1;font-size:13px;color:var(--muted)}
/* fasting clock */
#hub .fast{padding:18px 16px;display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
#hub .ring{position:relative;width:150px;height:150px}
#hub .ring svg{width:150px;height:150px;transform:rotate(-90deg)}
#hub .ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#hub .ring .mid b{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
#hub .ring .mid small{font-size:11px;color:var(--muted)}
#hub .stage b{display:block;font-size:16px;margin:3px 0 4px}
#hub .stage p{font-size:13px;color:var(--muted);line-height:1.45;margin-bottom:10px}
#hub .goals{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
#hub .goals button{border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:600}
#hub .goals button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#hub .stages{border-top:1px solid var(--line);padding:6px 16px 10px}
#hub .st{display:flex;gap:10px;align-items:center;padding:7px 0;font-size:13px;color:var(--faint)}
#hub .st i{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
#hub .st.past{color:var(--muted)}#hub .st.past i{background:var(--sand)}
#hub .st.now{color:var(--ink);font-weight:600}#hub .st.now i{background:var(--sage);box-shadow:0 0 0 4px var(--sageS)}
#hub .st em{font-style:normal;margin-left:auto;font-size:12px;font-weight:500}
#hub .note{font-size:12px;color:var(--muted);line-height:1.45;padding:0 16px 14px}
#hub .hist{display:flex;gap:6px;overflow-x:auto;padding:0 16px 14px;scrollbar-width:none}
#hub .hist span{flex:none;font-size:12px;background:var(--soft);border-radius:999px;padding:5px 10px;color:var(--muted)}
/* sound */
#hub .rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px 6px;scroll-padding:0 16px;scrollbar-width:none}
#hub .rail::-webkit-scrollbar,#hub .hist::-webkit-scrollbar{display:none}
#hub .daily{position:relative;display:block;width:100%;text-align:left;border:0;border-radius:12px;padding:20px 64px 20px 18px;margin-top:10px;color:#fff;cursor:pointer;overflow:hidden}
#hub .daily small{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
#hub .daily b{display:block;font-family:var(--serif);font-weight:600;font-size:28px;line-height:1.05;margin-top:4px}
#hub .daily .sub{display:block;font-size:13px;opacity:.9;margin-top:6px;line-height:1.4}
#hub .daily .pl{position:absolute;top:50%;right:16px;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center}
#hub .trk{flex:0 0 46%;max-width:200px;scroll-snap-align:start;text-align:left}
#hub .trk .art{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;color:#fff}
#hub .trk .art b{font-family:var(--serif);font-weight:600;font-size:21px;line-height:1.02;position:relative}
#hub .trk .art small{font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.85;position:relative}
#hub .trk .art:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.45))}
#hub .trk .art .pl{position:absolute;top:10px;right:10px;z-index:1;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center}
#hub .trk .cap{font-size:13px;font-weight:600;margin-top:7px}
#hub .trk .cap small{display:block;font-weight:400;color:var(--muted);font-size:12px}
#hub .trk.today .art{outline:2px solid var(--ink);outline-offset:2px}
#hub .player{position:fixed;left:50%;transform:translateX(-50%);bottom:72px;width:calc(100% - 20px);max-width:740px;z-index:24;background:var(--ink);color:#fff;border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#hub .player .pi{flex:1;min-width:0}
#hub .player .pi b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hub .player .pi small{font-size:12px;opacity:.7}
#hub .player .bar{height:3px;background:rgba(255,255,255,.18);border-radius:3px;margin-top:6px;overflow:hidden}
#hub .player .bar i{display:block;height:100%;width:0;background:#fff}
#hub .player button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
#hub .player .pp{background:#fff;color:var(--ink)}
#hub .player select{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:6px;padding:6px;font:inherit;font-size:12px}
/* community */
#hub .bar2{display:flex;gap:8px;align-items:center;margin-top:10px}
#hub .bar2 .filter{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
#hub .bar2 .filter button{border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:600;color:var(--muted)}
#hub .bar2 .filter button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#hub .compose{padding:12px;margin-top:12px}
#hub .compose textarea{width:100%;border:0;resize:none;min-height:46px;font-size:15px;line-height:1.45;outline:none;background:transparent}
#hub .compose .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;border-top:1px solid var(--line);padding-top:10px}
#hub .compose .row label{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
#hub .post{padding:14px 14px 6px;margin-top:10px}
#hub .post.pin{border-color:var(--sand);background:#fcfbf9}
#hub .ph2{display:flex;gap:10px;align-items:center}
#hub .av{width:38px;height:38px;border-radius:50%;background:var(--soft2);display:grid;place-items:center;font-size:19px;flex:none}
#hub .who{flex:1;min-width:0}
#hub .who b{font-size:14.5px}
#hub .who small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
#hub .mk{display:inline-block;background:var(--ink);color:#fff;font-size:10px;font-weight:700;letter-spacing:.06em;padding:2px 6px;border-radius:4px;margin-left:5px;vertical-align:2px}
#hub .tag{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:4px;background:var(--soft2);color:var(--muted);margin:10px 4px 0 0}
#hub .tag.ok{background:var(--sageS);color:var(--sage)}
#hub .tag.gold{background:#f6efe0;color:var(--gold)}
#hub .body{font-size:15px;line-height:1.55;margin-top:8px;white-space:pre-wrap;word-wrap:break-word}
#hub .acts{display:flex;gap:4px;margin-top:8px;border-top:1px solid var(--line);padding-top:4px}
#hub .acts button{flex:1;padding:8px 0;font-size:13.5px;font-weight:600;color:var(--muted);border-radius:6px;display:flex;gap:6px;justify-content:center;align-items:center}
#hub .acts button.on{color:var(--terra)}
#hub .more{width:30px;height:30px;border-radius:50%;color:var(--faint);font-size:20px;line-height:1}
#hub .cmts{border-top:1px solid var(--line);padding:8px 0 6px}
#hub .cm{display:flex;gap:8px;padding:6px 0}
#hub .cm .av{width:30px;height:30px;font-size:15px}
#hub .cm .bub{background:var(--soft);border-radius:12px;padding:8px 11px;font-size:14px;line-height:1.45;max-width:100%;word-wrap:break-word}
#hub .cm .bub b{font-size:13px;display:block}
#hub .cm .meta{font-size:11.5px;color:var(--faint);margin:3px 0 0 11px}
#hub .cm .meta button{font-size:11.5px;color:var(--faint);margin-left:8px}
#hub .cin{display:flex;gap:8px;margin-top:6px}
#hub .cin input{flex:1;border:1px solid var(--line);border-radius:999px;padding:9px 13px;font-size:14px;outline:none}
/* live */
#hub .stage16{position:relative;aspect-ratio:16/9;background:#141210;border-radius:8px;overflow:hidden;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center}
#hub .stage16 iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#hub .stage16 .off{padding:20px}
#hub .stage16 .off b{display:block;font-family:var(--serif);font-weight:500;font-size:26px;margin:6px 0}
#hub .stage16 .off small{opacity:.7;font-size:13px}
#hub .livepill{display:inline-flex;align-items:center;gap:6px;background:#d0413a;color:#fff;font-size:11px;font-weight:700;letter-spacing:.08em;padding:4px 8px;border-radius:4px}
#hub .livepill i{width:7px;height:7px;border-radius:50%;background:#fff;animation:hubpulse 1.2s infinite}
@keyframes hubpulse{50%{opacity:.3}}
#hub .chat{height:320px;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
#hub .msg{font-size:14px;line-height:1.4}
#hub .msg b{font-weight:600;margin-right:5px}
#hub .msg .x{color:var(--faint);font-size:12px;margin-left:6px}
#hub .chatin{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
#hub .chatin input{flex:1;border:1px solid var(--line);border-radius:999px;padding:10px 14px;font-size:14px;outline:none}
#hub .adm{padding:14px;margin-top:12px;background:var(--soft);border:1px dashed var(--sand)}
#hub .adm label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 4px}
#hub .adm input{width:100%;border:1px solid var(--line);border-radius:6px;padding:9px 10px;font-size:14px;background:#fff}
/* library */
#hub .lib{display:flex;gap:12px;align-items:center;padding:12px;margin-top:8px;width:100%;text-align:left}
#hub .lib .ic{width:46px;height:46px;border-radius:8px;display:grid;place-items:center;font-size:22px;flex:none;background:var(--soft2)}
#hub .lib div{flex:1;min-width:0}
#hub .lib b{display:block;font-size:14.5px}
#hub .lib small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.4}
#hub .lib em{font-style:normal;font-size:12px;font-weight:600;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:5px 10px;flex:none}
#hub .book{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:14px;align-items:center}
#hub .book .cover{aspect-ratio:2/3;border-radius:4px;background:linear-gradient(160deg,#2a2725,#4a3f37);color:#f5efe4;display:flex;flex-direction:column;justify-content:space-between;padding:10px;box-shadow:4px 6px 14px rgba(0,0,0,.18);background-size:cover;background-position:center}
#hub .book .cover b{font-family:var(--serif);font-size:16px;line-height:1.05}
#hub .book .cover small{font-size:8px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
#hub .fine{font-size:11.5px;color:var(--faint);line-height:1.5;padding:10px 16px 0}
/* sheets */
#hub .scrim{position:fixed;inset:0;background:rgba(28,26,25,.35);z-index:40;opacity:0;pointer-events:none;transition:.2s}
#hub .sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:100%;max-width:760px;max-height:86vh;overflow-y:auto;background:#fff;border-radius:14px 14px 0 0;z-index:41;transition:transform .25s ease;padding:10px 16px calc(20px + env(safe-area-inset-bottom))}
#hub .sheet{visibility:hidden;transition:transform .25s ease,visibility 0s .25s}#hub .sheet.open{transform:translate(-50%,0);visibility:visible;transition:transform .25s ease}
#hub .scrim.open{opacity:1;pointer-events:auto}
#hub .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
#hub .sheet h3{font-size:18px;font-weight:600;margin-bottom:4px}
#hub .sheet p.s{font-size:13.5px;color:var(--muted);margin-bottom:12px;line-height:1.45}
#hub .opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:13px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
#hub .opt.on{border-color:var(--ink);background:var(--soft)}
#hub .opt .e{font-size:22px}
#hub .opt b{display:block;font-size:15px}
#hub .opt small{font-size:12.5px;color:var(--muted)}
#hub .emo{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:8px 0 12px}
#hub .emo button{aspect-ratio:1;border-radius:8px;font-size:21px;border:1px solid var(--line)}
#hub .emo button.on{border-color:var(--ink);background:var(--soft)}
#hub .field{width:100%;border:1px solid var(--line);border-radius:6px;padding:11px 12px;font-size:15px;outline:none;margin-bottom:10px}
#hub .moods{display:flex;gap:8px;margin:6px 0 12px}
#hub .moods button{flex:1;aspect-ratio:1;max-width:58px;border-radius:10px;border:1px solid var(--line);font-size:24px}
#hub .moods button.on{border-color:var(--ink);background:var(--soft)}
#hub .jr{padding:16px}
#hub .jq{display:block;margin-top:6px}
#hub .jq b{display:block;font-size:14px;margin:8px 0 6px}
#hub .jq .field{resize:vertical;min-height:72px;font-family:inherit;line-height:1.45}
#hub .jr .pact{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px}
#hub .jent{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px;margin-bottom:8px}
#hub .jent.on{border-color:var(--ink)}
#hub .jent .jm{font-size:24px;flex:none}
#hub .jent b{display:block;font-size:14px}
#hub .jent small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.35}
#hub .toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13.5px;padding:10px 16px;border-radius:999px;z-index:60;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}
#hub .toast.on{opacity:1}

function ambient(t){

  var master=ctx.createGain(); master.gain.value=0; master.connect(ctx.destination); master.gain.setTargetAtTime(.5,ctx.currentTime,1.5);
  var lp=ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=900; lp.connect(master);
  var nodes=[], f=t.root;
  [[f,0,.22],[f*1.5,3,.12],[f*2,-4,.08],[f*2.5,5,.05],[f/2,0,.18]].forEach(function(v,i){
    var o=ctx.createOscillator(), g=ctx.createGain(), l=ctx.createOscillator(), lg=ctx.createGain();
    o.type=i===4?"triangle":"sine"; o.frequency.value=v[0]; o.detune.value=v[1]; g.gain.value=v[2];
    l.frequency.value=.05+i*.03; lg.gain.value=v[2]*.6; l.connect(lg); lg.connect(g.gain);
    o.connect(g); g.connect(lp); o.start(); l.start(); nodes.push(o,l); });
  var buf=ctx.createBuffer(1,ctx.sampleRate*4,ctx.sampleRate), d=buf.getChannelData(0), last=0;
  for(var i=0;i<d.length;i++){ last=(last+.02*(Math.random()*2-1))/1.02; d[i]=last*3.5; }

  var ng=ctx.createGain(); ng.gain.value=.25; var wl=ctx.createOscillator(), wg=ctx.createGain(); wl.frequency.value=.08; wg.gain.value=.18; wl.connect(wg); wg.connect(ng.gain);

function postHTML(p){
  var P=PROTOCOLS[p.protocol], h='<article class="card post'+(p.pinned?' pin':'')+'" data-id="'+p.id+'"><div class="ph2"><div class="av">'+esc(p.avatar)+'</div><div class="who"><b>'+esc(p.author)+'</b>'+(p.is_mark?'<span class="mk">MARK</span>':'')+'<small>'+ago(p.created_at)+(P?' · '+esc(P.emoji+" "+P.name):'')+'</small></div>'+((p.mine||me.admin)?'<button class="more" data-menu="'+p.id+'">⋯</button>':'')+'</div>';
  if(p.pinned) h+='<span class="tag gold">📌 Pinned</span>';
  if(p.kind==="announce") h+='<span class="tag gold">Announcement</span>';
  if(p.kind==="checkin") h+='<span class="tag ok">Day '+esc(p.day)+' check-in</span>';
  if(p.kind==="fast") h+='<span class="tag ok">⏱ Fast complete</span>';
  if(p.room==="qa") h+='<span class="tag'+(p.answered?' ok':'')+'">'+(p.answered?'✓ Answered':'Awaiting answer')+'</span>';
  h+='<div class="body">'+esc(p.body)+'</div><div class="acts"><button data-like="'+p.id+'" class="'+(p.liked?'on':'')+'">'+(p.liked?'♥':'♡')+' '+(p.likes>0?p.likes:'Like')+'</button><button data-c="'+p.id+'">💬 '+(p.comments>0?p.comments+(p.room==="qa"?(p.comments>1?' replies':' reply'):(p.comments>1?' comments':' comment')):(p.room==="qa"?'Answer':'Comment'))+'</button></div>';
  if(openC[p.id]){ h+='<div class="cmts">'; (cmtCache[p.id]||[]).forEach(function(c){ h+='<div class="cm"><div class="av">'+esc(c.avatar)+'</div><div style="min-width:0"><div class="bub"><b>'+esc(c.author)+(c.is_mark?'<span class="mk">MARK</span>':'')+'</b>'+esc(c.body)+'</div><div class="meta">'+ago(c.created_at)+((c.mine||me.admin)?'<button data-dc="'+c.id+'" data-p="'+p.id+'">Delete</button>':'')+'</div></div></div>'; });
    if(!me.banned) h+='<div class="cin"><input data-ci="'+p.id+'" maxlength="1500" placeholder="'+(p.room==="qa"&&me.admin?"Write your answer…":"Write a comment…")+'"><button class="btn sm" data-cs="'+p.id+'">Send</button></div>'; h+='</div>'; }
  return h+'</article>';
}
function drawPosts(){
  var box=$("hPosts"); if(!box)return;
  box.innerHTML=posts.length?posts.map(postHTML).join(""):'<div class="empty">'+(room==="qa"?"No questions yet. Ask Mark anything about your protocol.":"Be the first to post. Share how your first day went!")+'</div>';
  box.querySelectorAll("[data-like]").forEach(function(b){ b.onclick=function(){ var id=+b.dataset.like, p=posts.filter(function(x){return x.id===id;})[0]; p.liked=!p.liked; p.likes=+p.likes+(p.liked?1:-1); drawPosts(); rpc("hub_like",{p_post:id}).catch(err); }; });
  box.querySelectorAll("[data-c]").forEach(function(b){ b.onclick=function(){ var id=+b.dataset.c; openC[id]=!openC[id]; if(openC[id]) loadComments(id); else drawPosts(); }; });
  box.querySelectorAll("[data-cs]").forEach(function(b){ var id=+b.dataset.cs, inp=box.querySelector('[data-ci="'+id+'"]');
    var send=function(){ var t=inp.value.trim(); if(!t)return; b.disabled=true; rpc("hub_comment",{p_post:id,p_body:t}).then(function(){ var p=posts.filter(function(x){return x.id===id;})[0]; if(p)p.comments=+p.comments+1; loadComments(id);
      if(me.admin&&room==="qa"&&p&&!p.answered){ rpc("hub_admin",{p_pass:pass,p_action:"answered",p_post:id}).then(function(){ p.answered=true; drawPosts(); }); } }).catch(function(e){ b.disabled=false; err(e); }); };
    b.onclick=send; inp.onkeydown=function(e){ if(e.key==="Enter")send(); }; });
  box.querySelectorAll("[data-dc]").forEach(function(b){ b.onclick=function(){ if(!confirm("Delete this comment?"))return; var pid=+b.dataset.p; rpc("hub_delete",{p_post:pid,p_comment:+b.dataset.dc,p_pass:pass||null}).then(function(){ var p=posts.filter(function(x){return x.id===pid;})[0]; if(p)p.comments=Math.max(0,p.comments-1); loadComments(pid); }).catch(err); }; });
  box.querySelectorAll("[data-menu]").forEach(function(b){ b.onclick=function(){ postMenu(+b.dataset.menu); }; });
}
function loadComments(id){ rpc("hub_comments_for",{p_post:id}).then(function(r){ cmtCache[id]=r||[]; drawPosts(); var i=$("hPosts").querySelector('[data-ci="'+id+'"]'); if(i&&openC[id]===true){ openC[id]=1; i.focus(); } }).catch(err); }
function postMenu(id){
  var p=posts.filter(function(x){return x.id===id;})[0]; if(!p)return;
  var h='<h3>Post options</h3><p class="s">'+esc(p.body.slice(0,90))+(p.body.length>90?'…':'')+'</p>';
  if(me.admin){ h+='<button class="opt" data-a="pin"><span class="e">📌</span><span><b>'+(p.pinned?'Unpin':'Pin to top')+'</b></span></button>';
    if(p.room==="qa") h+='<button class="opt" data-a="answered"><span class="e">✓</span><span><b>'+(p.answered?'Mark as unanswered':'Mark as answered')+'</b></span></button>';
    if(!p.mine&&!p.is_mark) h+='<button class="opt" data-a="ban"><span class="e">⛔</span><span><b>Remove this member</b><small>They can still read, but can no longer post</small></span></button>'; }
  h+='<button class="opt" data-a="delete"><span class="e">🗑</span><span><b>Delete post</b></span></button>';
  sheet(h,function(b){ b.querySelectorAll("[data-a]").forEach(function(x){ x.onclick=function(){ var a=x.dataset.a;
    if(a==="delete"){ if(!confirm("Delete this post?"))return; rpc("hub_delete",{p_post:id,p_pass:pass||null}).then(function(){ closeSheet(); toast("Deleted"); posts=posts.filter(function(q){return q.id!==id;}); drawPosts(); }).catch(err); return; }
    if(a==="ban"&&!confirm("Stop this member from posting?"))return;
    rpc("hub_admin",{p_pass:pass,p_action:a,p_post:id}).then(function(){ closeSheet(); toast("Done"); loadPosts(false); }).catch(err); }; }); });
}

/* ============================ LIVE ============================ */
var chat=[], chatT=null;
function renderLive(){
  var L=live, h='<div class="sec"><div class="stage16">';
  if(L.is_live&&L.embed) h+='<iframe src="'+esc(L.embed)+'" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>';
  else h+='<div class="off">'+(L.is_live?'<span class="livepill"><i></i>LIVE NOW</span>':'<div class="kick" style="color:#a39a92">Next live session</div>')+'<b>'+esc(L.title||"Live with Mark")+'</b><small>'+esc(L.is_live?"Join using the button below":(L.next||"Date coming soon — check back here"))+'</small></div>';
  h+='</div><div style="display:flex;gap:8px;align-items:center;margin-top:12px">'+(L.is_live?'<span class="livepill"><i></i>LIVE</span>':'')+'<div style="flex:1;font-size:14px;font-weight:600">'+esc(L.title||"")+'</div>'+(L.link?'<a class="btn sm" href="'+esc(L.link)+'" target="_blank" rel="noopener">'+(L.is_live?"Join live":"Open link")+'</a>':'')+'</div>';
  h+='<div class="card" style="margin-top:14px"><div style="padding:12px 12px 0"><div class="kick">Live chat</div></div><div class="chat" id="hChat"></div>'+(me.banned?'':'<div class="chatin"><input id="hChatIn" maxlength="500" placeholder="Say hello or ask a question…"><button class="btn sm" id="hChatGo">Send</button></div>')+'</div>';
  if(me.admin) h+='<div class="card adm"><b style="font-size:14px">Run a live (only you see this)</b><label><input type="checkbox" id="lOn" style="width:auto" '+(L.is_live?'checked':'')+'> We are live now</label><label>Title</label><input id="lTitle" value="'+esc(L.title||"")+'"><label>Next session (shown when you are not live)</label><input id="lNext" placeholder="e.g. Thursday 7pm ET" value="'+esc(L.next||"")+'"><label>YouTube live embed link (optional)</label><input id="lEmbed" placeholder="https://www.youtube.com/embed/VIDEO_ID" value="'+esc(L.embed||"")+'"><label>Join link — Zoom, YouTube, etc. (optional)</label><input id="lLink" placeholder="https://zoom.us/j/…" value="'+esc(L.link||"")+'"><button class="btn" id="lSave" style="margin-top:12px;width:100%">Save live settings</button></div>';
  h+='</div>'; $("vLive").innerHTML=h; drawChat();
  if($("hChatGo")){ var send=function(){ var t=$("hChatIn").value.trim(); if(!t)return; $("hChatIn").value=""; rpc("hub_post",{p_room:"live",p_protocol:"all",p_day:null,p_kind:"chat",p_body:t}).then(function(){ refreshChat(true); }).catch(err); };
    $("hChatGo").onclick=send; $("hChatIn").onkeydown=function(e){ if(e.key==="Enter")send(); }; }
  if($("lSave")) $("lSave").onclick=function(){ var emb=$("lEmbed").value.trim(), m=emb.match(/(?:youtu\.be\/|v=|\/live\/)([A-Za-z0-9_-]{11})/); if(m) emb="https://www.youtube.com/embed/"+m[1]+"?autoplay=1";
    rpc("hub_admin",{p_pass:pass,p_action:"live",p_value:{is_live:$("lOn").checked,title:$("lTitle").value.trim(),next:$("lNext").value.trim(),embed:emb,link:$("lLink").value.trim()}}).then(function(L2){ live=L2||live; liveDot(); renderLive(); toast("Live settings saved"); }).catch(err); };
}
function drawChat(){ var c=$("hChat"); if(!c)return; var atBottom=c.scrollHeight-c.scrollTop-c.clientHeight<40;
  c.innerHTML=chat.length?chat.map(function(m){ return '<div class="msg"><b>'+esc(m.avatar+" "+m.author)+(m.is_mark?'<span class="mk">MARK</span>':'')+'</b>'+esc(m.body)+((m.mine||me.admin)?'<button class="x" data-x="'+m.id+'">✕</button>':'')+'</div>'; }).join(""):'<div class="empty">No messages yet.</div>';
  c.querySelectorAll("[data-x]").forEach(function(b){ b.onclick=function(){ rpc("hub_delete",{p_post:+b.dataset.x,p_pass:pass||null}).then(function(){ refreshChat(true); }).catch(err); }; });
  if(atBottom) c.scrollTop=c.scrollHeight; }
function refreshChat(force){ if(view!=="Live"&&!force)return;
  rpc("hub_list",{p_room:"live",p_protocol:"all",p_before:null,p_limit:60}).then(function(r){ chat=(r||[]).slice().reverse(); if(view==="Live") drawChat(); }).catch(function(){});
  rpc("hub_join",{p_pass:pass||null}).then(function(j){ if(j&&j.live){ var was=JSON.stringify(live); live=j.live; liveDot(); if(view==="Live"&&was!==JSON.stringify(live)) renderLive(); } }).catch(function(){}); }
function liveDot(){ $("hLiveDot").hidden=!live.is_live; }

/* ============================ JOURNAL ============================ */
var JPROMPTS=[["body","How does your body feel today?","Energy, digestion, sleep, cravings…"],["grateful","Three things you're grateful for","Small things count"],["letgo","What are you letting go of?","A habit, a worry, a story you tell yourself"],["win","Today's win","Anything you're proud of, however small"]];
var jSel=null;
function jKey(t){ var d=new Date(t); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function jNice(k){ var p=k.split("-"); return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"}); }
function renderJournal(){
  if(!S.journal) S.journal={};
  var today=jKey(Date.now()); if(!jSel) jSel=today;
  var e=S.journal[jSel]||{}, moods=["😣","😕","😐","🙂","😄"], d=curDay();
  var h='<div class="hello"><div class="kick">Your journal · private to you</div><h1>'+(jSel===today?"Today's page":esc(jNice(jSel)))+'</h1><p>'+(jSel===today?esc(jNice(today))+(d>=1&&d<=7?" · Day "+d+" of your first week":""):"A past entry. You can still edit it.")+'</p></div>';
  h+='<div class="sec" style="padding-top:4px"><div class="card jr"><div class="kick">How are you feeling?</div><div class="moods">';
  moods.forEach(function(m,i){ h+='<button data-jm="'+i+'" class="'+(e.mood===i?'on':'')+'" aria-label="Mood '+(i+1)+' of 5">'+m+'</button>'; });
  h+='</div>';
  JPROMPTS.forEach(function(q){ h+='<label class="jq"><b>'+esc(q[1])+'</b><textarea class="field" rows="3" maxlength="2000" data-jp="'+q[0]+'" placeholder="'+esc(q[2])+'">'+esc(e[q[0]]||"")+'</textarea></label>'; });
  h+='<label class="jq"><b>Anything else</b><textarea class="field" rows="4" maxlength="4000" data-jp="free" placeholder="Write freely. Only you can see this.">'+esc(e.free||"")+'</textarea></label>';
  h+='<div class="pact"><span class="prog" id="hJSaved">'+(e.t?"Saved "+new Date(e.t).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}):"Saves as you type")+'</span>'+(jSel!==today?'<button class="btn ghost" id="hJToday">Back to today</button>':'')+'</div></div></div>';
  var keys=Object.keys(S.journal).filter(function(k){ var x=S.journal[k]; return x&&(x.mood!=null||JPROMPTS.some(function(q){return x[q[0]];})||x.free); }).sort().reverse();
  h+='<div class="sec"><div class="h"><h2>Past entries</h2><span>'+keys.length+' page'+(keys.length===1?'':'s')+'</span></div>';
  if(!keys.length) h+='<p class="note" style="padding:0">Your entries appear here, one page per day.</p>';
  keys.forEach(function(k){ var x=S.journal[k], first=(x.body||x.grateful||x.letgo||x.win||x.free||""); h+='<button class="card jent'+(k===jSel?' on':'')+'" data-jk="'+k+'"><span class="jm">'+(x.mood!=null?moods[x.mood]:"📓")+'</span><div><b>'+esc(jNice(k))+'</b><small>'+esc(first.slice(0,90))+(first.length>90?"…":"")+'</small></div></button>'; });
  h+='</div>';
  var v=$("vJournal"); v.innerHTML=h;
  var save=function(){ var x=S.journal[jSel]||{}; v.querySelectorAll("[data-jp]").forEach(function(t){ x[t.dataset.jp]=t.value; }); x.t=Date.now(); S.journal[jSel]=x; persist(); var sv=$("hJSaved"); if(sv) sv.textContent="Saved "+new Date(x.t).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}); };
  var jt=null; v.querySelectorAll("[data-jp]").forEach(function(t){ t.oninput=function(){ clearTimeout(jt); jt=setTimeout(save,600); }; t.onblur=save; });
  v.querySelectorAll("[data-jm]").forEach(function(b){ b.onclick=function(){ var x=S.journal[jSel]||{}; x.mood=+b.dataset.jm; S.journal[jSel]=x; save(); renderJournal(); }; });
  v.querySelectorAll("[data-jk]").forEach(function(b){ b.onclick=function(){ jSel=b.dataset.jk; renderJournal(); window.scrollTo(0,0); }; });
  if($("hJToday")) $("hJToday").onclick=function(){ jSel=null; renderJournal(); };
}

/* ============================ LIBRARY ============================ */
function renderLibrary(){
  var B=LIBRARY.book, mine=function(x){ return x.protocol==="all"||x.protocol===S.protocol; };
  var h='<div class="sec"><div class="h"><h2>The book</h2></div><a class="card book" href="'+esc(B.url)+'" target="_blank" rel="noopener"><div class="cover" style="'+(B.cover?'background-image:url(&quot;'+esc(B.cover)+'&quot;)':'')+'">'+(B.cover?'':'<small>Mark Talks Health</small><b>'+esc(B.title)+'</b><small>Mark</small>')+'</div><div><div class="kick">Available on Amazon</div><b style="display:block;font-size:17px;margin:4px 0">'+esc(B.title)+'</b><p style="font-size:13.5px;color:#6f6863;line-height:1.45;margin-bottom:10px">'+esc(B.sub)+'</p><span class="btn sm">Get it on Amazon</span></div></a></div>';
  h+='<div class="sec"><div class="h"><h2>Downloads</h2><span>'+esc(PROTOCOLS[S.protocol].name)+' + everyone</span></div>';
  LIBRARY.downloads.filter(mine).forEach(function(d){ h+='<a class="card lib" href="'+esc(d.url)+'" target="_blank" rel="noopener"><span class="ic">📄</span><div><b>'+esc(d.title)+'</b><small>'+esc(d.sub)+'</small></div><em>PDF</em></a>'; });
  h+='</div><div class="sec"><div class="h"><h2>Your tools</h2></div>';
  LIBRARY.tools.forEach(function(d){ h+='<a class="card lib" href="'+esc(d.url)+'" target="_top"><span class="ic">'+esc(d.icon)+'</span><div><b>'+esc(d.title)+'</b><small>'+esc(d.sub)+'</small></div><em>Open</em></a>'; });
  h+='</div>';
  $("vLibrary").innerHTML=h;
}

/* ============================ boot ============================ */
function renderAll(){ var P=PROTOCOLS[S.protocol]; $("hProtoName").textContent=P.name; $("hMeBtn").textContent=me.avatar; renderToday(); renderCommunity(); renderLive(); renderJournal(); renderLibrary(); if(view==="Community") refreshCommunity(); }
function startPolling(){ setInterval(function(){ if(document.hidden)return; if(view==="Community") loadPosts(false); },20000);
  setInterval(function(){ if(document.hidden)return; if(view==="Live") refreshChat(); else refreshChat.n=(refreshChat.n||0)+1, refreshChat.n%8===0&&refreshChat(true); },4000); }

renderAll();
whoAsk(2500).then(function(u){
  if(!u){ demo=true; $("hBanner").hidden=false; $("hBanner").innerHTML="<b>Preview mode.</b> Open this inside your Mark Talks Health account to join the real community. Anything you post here stays on this device.";
    me.name=ls.get(LS+"_demoName")||"You"; return rpc("hub_join",{}).then(function(){ renderAll(); refreshChat(true); startPolling(); }); }
  member=u; sync("Connecting…");
  return rpc("hub_join",{p_pass:pass||null}).then(function(j){
    me.name=j.name; me.avatar=j.avatar; me.admin=!!j.admin; me.owner=!!j.is_owner_email; me.banned=!!j.banned; if(j.live) live=j.live;
    if(pass&&!me.admin){ pass=""; ls.set(LS+"_pass",""); }
    if(j.state&&Object.keys(j.state).length){ var keepFast=S.fast; S=Object.assign(S,j.state); if(PAGE_PROTOCOL&&PROTOCOLS[PAGE_PROTOCOL])S.protocol=PAGE_PROTOCOL; else if(ownProto())S.protocol=ownProto(); if(!S.journal)S.journal={}; if(!S.fast&&keepFast)S.fast=keepFast; ls.set(LS,JSON.stringify(S)); }
    else persist();
    sync("Saved to your account"); liveDot(); renderAll(); refreshChat(true); startPolling();
    if(me.name&&/^[a-z]/.test(me.name)===false&&!ls.get(LS+"_named")){ ls.set(LS+"_named","1"); setTimeout(function(){ toast("Tap your avatar to set your name and picture"); },1200); }
  }).catch(function(e){ console.warn(e); sync("Couldn't reach the community — your Today tab still works offline"); demo=false; });
});
})();
</script>
